alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s
  retention: 1d
  retentionSize: 2GB
  persistentVolume:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageClass: uptime-gp3
    size: 5Gi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  terminationGracePeriodSeconds: 60

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
