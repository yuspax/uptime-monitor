apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-agent
  template:
    metadata:
      labels:
        app: uptime-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python-agent
          image: uptime-agent:bootstrap
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: uptime-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: uptime-secrets
                  key: DB_PASS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
