apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-agent
  template:
    metadata:
      labels:
        app: uptime-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python-agent
          image: uptime-agent:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: uptime-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: uptime-secrets
                  key: DB_PASS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-agent
spec:
  selector:
    app: uptime-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
