apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: uptime-gp3
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
