name: CI/CD

on:
  push:
    paths-ignore:
      - k8s/app/kustomization.yaml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m flake8 app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check lab script syntax
        run: bash -n scripts/lab.sh

      - name: Run unit tests
        run: python -m pytest

      - name: Build container image
        run: docker build --tag uptime-agent:${{ github.sha }} .

  publish:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment configuration
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN repository variable}"
          : "${ECR_REPOSITORY:?Set the ECR_REPOSITORY repository variable}"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: uptime-${{ github.run_id }}

      - name: Publish immutable image
        run: |
          existing_tag=$(aws ecr batch-get-image \
            --repository-name "${ECR_REPOSITORY##*/}" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageTag' --output text)
          if [ "$existing_tag" != None ]; then
            echo "Image already exists: $ECR_REPOSITORY:$IMAGE_TAG"
            exit 0
          fi
          docker build --platform linux/amd64 --tag "$ECR_REPOSITORY:$IMAGE_TAG" .
          aws ecr get-login-password | docker login \
            --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

  update-manifest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master

      - name: Update desired image in Git
        run: |
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
            echo "master has moved; the next run will deploy its image."
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("k8s/app/kustomization.yaml")
          content, count = re.subn(
              r"(?m)^([ \t]*newTag:)[^\n]*$",
              lambda match: f"{match[1]} {os.environ['IMAGE_TAG']}",
              path.read_text(),
          )
          if count != 1:
              raise SystemExit("Expected exactly one application image tag")
          path.write_text(content)
          PY
          if git diff --quiet -- k8s/app/kustomization.yaml; then
            echo "The desired image is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/app/kustomization.yaml
          git commit -m "chore: deploy uptime-agent $IMAGE_TAG"
          git push origin HEAD:master
